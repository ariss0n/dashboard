<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Árisson · Dashboard</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0A0E14;
      --surface: #121820;
      --card: #1A2430;
      --accent: #E94560;
      --accent-glow: rgba(233,69,96,0.25);
      --text: #E8EAED;
      --muted: #8892A4;
      --radius: 14px;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      max-width: 720px;
      width: 100%;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 1.2rem 1rem;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, var(--accent-glow), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .card:hover::before { opacity: 1; }
    .card-icon {
      font-size: 1.5rem;
      line-height: 1;
      z-index: 1;
    }
    .card-label {
      font-size: 0.8rem;
      font-weight: 500;
      text-align: center;
      z-index: 1;
      color: var(--muted);
    }
    .card:hover .card-label { color: var(--text); }
    .footer {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.5;
    }
    @media (max-width: 400px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      body { padding: 2rem 1rem; }
    }
  </style>
</head>
<body>
  <h1>✦ arisson</h1>
  <p class="subtitle">dashboard pessoal</p>

  <div class="grid">
    <a href="https://chatgpt.com" class="card"><span class="card-icon">🤖</span><span class="card-label">ChatGPT</span></a>
    <a href="https://claude.ai" class="card"><span class="card-icon">🟣</span><span class="card-label">Claude AI</span></a>
    <a href="https://clc.is/amls2" class="card"><span class="card-icon">⚡</span><span class="card-label">AMLS</span></a>
    <a href="https://mail.google.com" class="card"><span class="card-icon">✉️</span><span class="card-label">Gmail</span></a>
    <a href="https://calendar.google.com" class="card"><span class="card-icon">📅</span><span class="card-label">Calendar</span></a>
    <a href="https://drive.google.com" class="card"><span class="card-icon">📁</span><span class="card-label">Drive</span></a>
    <a href="https://github.com/arissonnn" class="card"><span class="card-icon">💻</span><span class="card-label">GitHub</span></a>
    <a href="https://scholar.google.com.br" class="card"><span class="card-icon">🎓</span><span class="card-label">Scholar</span></a>
    <a href="https://pubmed.ncbi.nlm.nih.gov" class="card"><span class="card-icon">🔬</span><span class="card-label">PubMed</span></a>
    <a href="https://www.uptodate.com" class="card"><span class="card-icon">📖</span><span class="card-label">UpToDate</span></a>
    <a href="https://www.youtube.com" class="card"><span class="card-icon">▶️</span><span class="card-label">YouTube</span></a>
    <a href="https://www.google.com/maps" class="card"><span class="card-icon">📍</span><span class="card-label">Maps</span></a>
    <a href="https://telegram.org" class="card"><span class="card-icon">💬</span><span class="card-label">Telegram</span></a>
    <a href="https://app.raindrop.io" class="card"><span class="card-icon">🏷️</span><span class="card-label">Raindrop</span></a>
  </div>

  <div class="footer">árison danilo · não indexado</div>
</body>
</html>
