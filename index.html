<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Árisson · Dashboard</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0A0E14;
      --surface: #121820;
      --card: #1A2430;
      --accent: #E94560;
      --accent-glow: rgba(233,69,96,0.2);
      --text: #E8EAED;
      --muted: #6B7A8F;
      --radius: 14px;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 4rem;
    }
    .container {
      max-width: 780px;
      width: 100%;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    header .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.2rem;
    }
    .shortcuts {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .shortcut {
      background: var(--card);
      border-radius: 10px;
      padding: 0.5rem 1rem;
      text-decoration: none;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .shortcut:hover {
      border-color: var(--accent);
      background: #1E2A3A;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #1E2A3A;
    }
    .embed-wrap {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid #1E2A3A;
    }
    .embed-wrap iframe {
      border: 0;
      width: 100%;
      height: 520px;
      display: block;
    }
    .footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      opacity: 0.4;
      line-height: 1.6;
    }
    .footer a {
      color: var(--muted);
      text-decoration: none;
    }
    .footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>✦ arisson</h1>
      <p class="subtitle">dashboard pessoal — links ao vivo do Raindrop</p>
    </header>

    <div class="shortcuts">
      <a href="https://amls-neon.vercel.app" class="shortcut">⚡ AMLS Chat</a>
      <a href="https://drive.google.com/drive/folders/1ABTdnzHglq8Orv0u60pyaspM-0JuZ_hU" class="shortcut">📋 Prática Méd</a>
    </div>

    <div class="divider">todos os bookmarks</div>

    <div class="embed-wrap">
      <iframe allowfullscreen src="https://arisson_danilo.raindrop.page/arisson-dashboard-71979663/embed" title="arisson dashboard"></iframe>
    </div>

    <div class="footer">
      <a href="https://app.raindrop.io">+ adicionar link via Raindrop</a>
      <br>não indexado · <a href="https://clc.is/ari">clc.is/ari</a>
    </div>
  </div>
</body>
</html>
